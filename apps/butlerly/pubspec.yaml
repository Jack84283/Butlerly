name: butlerly
description: "Butlerly's local-first personal operations application."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the build name and build number may be overridden by Flutter tooling.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  butlerly_finance_application:
    path: ../../packages/butlerly_finance_application
  butlerly_finance_domain:
    path: ../../packages/butlerly_finance_domain
  butlerly_database:
    path: ../../packages/butlerly_database
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  get_it: ^9.2.1
  go_router: ^17.4.0
  sqflite_common_ffi: ^2.4.2
  sqflite_common: ^2.5.11
  path: ^1.9.1
  path_provider: ^2.1.6
  logging: ^1.3.0
  intl: ^0.20.2
  sqflite: ^2.4.3
  file_selector: ^1.1.0
  image_picker: ^1.1.2
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  assets:
    - assets/legal/
  uses-material-design: true
