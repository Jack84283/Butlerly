schemaVersion: "1.0.0"
ruleId: ANL-R029
ruleVersion: "1.1.0"
enabled: true
surface: insights
type: insight
nameKey: analysis.rule.r029.name
descriptionKey: analysis.rule.r029.description
period: selected_period
baseline: previousEquivalentPeriod
presentation:
  semantic_type: positive
  visualization_type: comparison
  primary_metric: amount
measure:
  operation: difference
  field: amount
  currencyBasis: baseCurrency
dependencies:
  - ANL-R001
  - ANL-R002
condition:
  operator: any
  children:
    # baseline = currentValue - absoluteChange. A positive baseline therefore
    # means currentValue > absoluteChange; require at least 20% improvement.
    - operator: all
      children:
        - operator: gtMultiplier
          left: currentValue
          right: absoluteChange
          value: "1"
        - operator: gte
          left: percentageChange
          value: "20"
    # A zero or negative baseline means absoluteChange >= currentValue.
    # Preserve signed improvements such as zero-to-positive, a smaller deficit,
    # and deficit-to-surplus without applying a naive percentage threshold.
    - operator: all
      children:
        - operator: gteMultiplier
          left: absoluteChange
          right: currentValue
          value: "1"
        - operator: gt
          left: absoluteChange
          value: "0"
severity: info
result:
  persistence: finding
  refresh: onInvalidation
  outputType: pattern
