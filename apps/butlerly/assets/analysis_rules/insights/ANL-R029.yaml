schemaVersion: "1.0.0"
ruleId: ANL-R029
ruleVersion: "1.1.0"
enabled: true
surface: insights
type: insight
nameKey: analysis.rule.r029.name
descriptionKey: analysis.rule.r029.description
period: selected_period
baseline: previousEquivalentPeriod
presentation:
  semantic_type: positive
  visualization_type: comparison
  primary_metric: amount
measure:
  operation: difference
  field: amount
  currencyBasis: baseCurrency
dependencies:
  - ANL-R001
  - ANL-R002
condition:
  operator: any
  children:
    # When prior savings were already positive, require a meaningful
    # improvement rather than surfacing trivial dollar changes.
    - operator: all
      children:
        - operator: gt
          left: baselineTotal
          value: "0"
        - operator: gte
          left: percentageChange
          value: "20"
    # Zero or negative prior savings use signed absolute improvement so
    # zero-to-positive, deficit reduction, and deficit-to-surplus all count.
    - operator: all
      children:
        - operator: lte
          left: baselineTotal
          value: "0"
        - operator: gt
          left: absoluteChange
          value: "0"
severity: info
result:
  persistence: finding
  refresh: onInvalidation
  outputType: pattern
