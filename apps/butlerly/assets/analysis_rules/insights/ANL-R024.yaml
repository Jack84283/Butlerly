schemaVersion: "1.0.0"
ruleId: ANL-R024
ruleVersion: "1.2.0"
enabled: true
surface: insights
type: insight
nameKey: analysis.rule.r024.name
descriptionKey: analysis.rule.r024.description
role: attention
period: selected_period
baseline: previousEquivalentPeriod
measure:
  operation: sum
  field: amount
  currencyBasis: baseCurrency
filters:
  direction: expense
condition:
  operator: any
  children:
    - operator: all
      children:
        - operator: gt
          left: currentTotal
          value: "0"
        - operator: gteMultiplier
          left: currentTotal
          right: baselineTotal
          value: "1.20"
    - operator: gtMultiplier
      left: currentMaximum
      right: baselineAverage
      value: "1.50"
result:
  persistence: finding
  refresh: onInvalidation
  outputType: alert
