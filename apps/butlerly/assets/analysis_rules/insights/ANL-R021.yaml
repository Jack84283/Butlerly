schemaVersion: "1.0.0"
ruleId: ANL-R021
ruleVersion: "1.1.0"
enabled: true
surface: insights
type: insight
nameKey: analysis.rule.r021.name
descriptionKey: analysis.rule.r021.description
role: attention
period: selected_period
baseline: previousEquivalentPeriod
measure:
  operation: sum
  field: amount
  currencyBasis: baseCurrency
grouping: category
