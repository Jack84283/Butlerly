schemaVersion: "1.0.0"
ruleId: ANL-R022
ruleVersion: "1.1.0"
enabled: true
surface: insights
type: insight
nameKey: analysis.rule.r022.name
descriptionKey: analysis.rule.r022.description
period: selected_period
baseline: previousEquivalentPeriod
measure:
  operation: sum
  field: amount
  currencyBasis: baseCurrency
grouping: subcategory
filters:
  direction: expense
condition:
  operator: all
  children:
    - operator: gt
      left: currentTotal
      value: "0"
    - operator: gteMultiplier
      left: currentTotal
      right: baselineTotal
      value: "1.20"
result:
  persistence: finding
  refresh: onInvalidation
  outputType: pattern
