schemaVersion: "1.0.0"
ruleId: ANL-R025
ruleVersion: "1.2.0"
enabled: true
surface: insights
type: insight
nameKey: analysis.rule.r025.name
descriptionKey: analysis.rule.r025.description
role: attention
period: selected_period
baseline: previousEquivalentPeriod
measure:
  operation: maximum
  field: amount
  currencyBasis: baseCurrency
grouping: transaction
