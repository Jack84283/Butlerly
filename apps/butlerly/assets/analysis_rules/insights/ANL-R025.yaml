ruleVersion: "1.0.1"
# Disabled until rollingMedian is backed by an explicitly defined historical
# rolling dataset. It must not fall back to the previous equivalent period.
enabled: false
surface: insights
type: insight
nameKey: analysis.rule.r025.name
descriptionKey: analysis.rule.r025.description
period: selected_period
baseline: rollingMedian
measure:
  operation: maximum
  field: amount
  currencyBasis: baseCurrency
filters:
  direction: expense
condition:
  operator: gte
  left: percentageChange
  value: "100"
result:
  persistence: finding
  refresh: onInvalidation
  outputType: pattern
