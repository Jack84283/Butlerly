name: Apply PR 192 test corrections

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 192
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Patch responsive tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          responsive = Path('apps/butlerly/test/app/responsive_shell_test.dart')
          text = responsive.read_text()

          # The production behavior is identical for iOS and Android mobile/tablet
          # sizing. Avoid leaking Flutter's global platform debug override across
          # widget-test invariant checks; unit coverage still verifies explicit
          # iOS and macOS classification.
          text = text.replace(
              "      debugDefaultTargetPlatformOverride = TargetPlatform.iOS;\n"
              "      addTearDown(() => debugDefaultTargetPlatformOverride = null);\n",
              "",
          )

          # Keep the desktop integration check explicit, but restore the global
          # debug override before the widget test body returns.
          old_desktop = """  testWidgets('desktop uses the isolated desktop shell', (tester) async {
    await _pumpAt(
      tester,
      const Size(1200, 500),
      platform: TargetPlatform.macOS,
    );

    expect(find.byType(NavigationRail), findsOneWidget);
    expect(
      find.byKey(const ValueKey('primary-desktop-navigation')),
      findsOneWidget,
    );
    expect(
      find.byKey(const ValueKey('primary-phone-navigation')),
      findsNothing,
    );
    expect(
      find.byKey(const ValueKey('primary-ipad-navigation')),
      findsNothing,
    );
    expect(
      tester.getSize(find.byKey(const ValueKey('home-page-content'))).width,
      ButlerlySize.pageContentMaxWidth,
    );
  });
"""
          new_desktop = """  testWidgets('desktop uses the isolated desktop shell', (tester) async {
    debugDefaultTargetPlatformOverride = TargetPlatform.macOS;
    try {
      await _pumpAt(tester, const Size(1200, 500));

      expect(find.byType(NavigationRail), findsOneWidget);
      expect(
        find.byKey(const ValueKey('primary-desktop-navigation')),
        findsOneWidget,
      );
      expect(
        find.byKey(const ValueKey('primary-phone-navigation')),
        findsNothing,
      );
      expect(
        find.byKey(const ValueKey('primary-ipad-navigation')),
        findsNothing,
      );
      expect(
        tester.getSize(find.byKey(const ValueKey('home-page-content'))).width,
        ButlerlySize.pageContentMaxWidth,
      );
    } finally {
      debugDefaultTargetPlatformOverride = null;
    }
  });
"""
          assert old_desktop in text
          text = text.replace(old_desktop, new_desktop)

          # Mobile/tablet widget tests can use the Flutter test platform. The
          # semantic policy unit test above separately pins iOS/macOS cases.
          text = re.sub(
              r'\n\s*platform: TargetPlatform\.iOS,',
              '',
              text,
          )

          old_pump = """Future<void> _pumpAt(
  WidgetTester tester,
  Size size, {
  required TargetPlatform platform,
}) async {
  debugDefaultTargetPlatformOverride = platform;
  addTearDown(() => debugDefaultTargetPlatformOverride = null);
"""
          new_pump = """Future<void> _pumpAt(WidgetTester tester, Size size) async {
"""
          assert old_pump in text
          text = text.replace(old_pump, new_pump)

          old_body = """Future<void> _pumpResponsiveBodyAt(
  WidgetTester tester,
  Size size, {
  required TargetPlatform platform,
}) async {
  debugDefaultTargetPlatformOverride = platform;
  addTearDown(() => debugDefaultTargetPlatformOverride = null);
"""
          new_body = """Future<void> _pumpResponsiveBodyAt(
  WidgetTester tester,
  Size size,
) async {
"""
          assert old_body in text
          text = text.replace(old_body, new_body)

          responsive.write_text(text)

          app_test = Path('apps/butlerly/test/app/butlerly_app_test.dart')
          app = app_test.read_text()
          old = """  testWidgets('uses adaptive navigation at tablet widths', (tester) async {
    tester.view.physicalSize = const Size(900, 800);
    tester.view.devicePixelRatio = 1;
    addTearDown(tester.view.resetPhysicalSize);
    addTearDown(tester.view.resetDevicePixelRatio);

    await tester.pumpWidget(const ProviderScope(child: ButlerlyApp()));
    await tester.pumpAndSettle();

    expect(find.byType(NavigationRail), findsOneWidget);
    expect(find.byType(NavigationBar), findsNothing);
  });
"""
          new = """  testWidgets('uses bottom navigation at tablet widths', (tester) async {
    tester.view.physicalSize = const Size(900, 800);
    tester.view.devicePixelRatio = 1;
    addTearDown(tester.view.resetPhysicalSize);
    addTearDown(tester.view.resetDevicePixelRatio);

    await tester.pumpWidget(const ProviderScope(child: ButlerlyApp()));
    await tester.pumpAndSettle();

    expect(find.byType(NavigationRail), findsNothing);
    expect(
      find.byKey(const ValueKey('primary-ipad-navigation')),
      findsOneWidget,
    );
  });
"""
          assert old in app
          app_test.write_text(app.replace(old, new))
          PY

          dart format \
            apps/butlerly/test/app/responsive_shell_test.dart \
            apps/butlerly/test/app/butlerly_app_test.dart

          git rm .github/workflows/pr192_test_fix.yml
          git config user.name "Jack"
          git config user.email "jack84283@gmail.com"
          git add apps/butlerly/test/app/responsive_shell_test.dart \
                  apps/butlerly/test/app/butlerly_app_test.dart
          git diff --cached --check
          git commit -m "Align tablet tests with bottom navigation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
