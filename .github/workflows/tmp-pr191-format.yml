name: Temporary PR191 formatting

on:
  push:
    branches:
      - codex/linkedin-responsive-content

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/linkedin-responsive-content
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
      - name: Format responsive changes
        run: |
          dart format \
            apps/butlerly/lib/features/foundation/presentation/contextual_pages.dart \
            apps/butlerly/lib/features/foundation/presentation/privacy_data_page.dart \
            apps/butlerly/test/app/responsive_shell_test.dart
      - name: Commit formatting and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-pr191-format.yml
          git add apps/butlerly/lib/features/foundation/presentation/contextual_pages.dart
          git add apps/butlerly/lib/features/foundation/presentation/privacy_data_page.dart
          git add apps/butlerly/test/app/responsive_shell_test.dart
          git diff --cached --check
          git commit -m "Format remaining responsive route fixes"
          git push origin HEAD:codex/linkedin-responsive-content
