name: Formatter Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Show formatter output
        run: |
          cd apps/butlerly
          dart format integration_test/v1_journeys_test.dart lib/app/shell/shared/primary_bottom_navigation.dart
          echo '--- primary_bottom_navigation.dart ---'
          cat lib/app/shell/shared/primary_bottom_navigation.dart
          echo '--- integration additions ---'
          sed -n '445,690p' integration_test/v1_journeys_test.dart
          exit 1
