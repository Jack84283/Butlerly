name: Apply PR 197 UI refinements

on:
  push:
    branches:
      - fix/ios-home-pull-to-refresh

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-home-pull-to-refresh
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
      - name: Apply UI refinements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          home = Path('apps/butlerly/lib/features/foundation/presentation/home_page.dart')
          text = home.read_text()

          text, count = re.subn(
              r"    final canvasColor = deviceClass == ButlerlyDeviceClass\.tablet\n"
              r"\s*\? context\.colors\.subtleSurface\n"
              r"\s*: context\.colors\.background;",
              "    final canvasColor = context.colors.subtleSurface;",
              text,
              count=1,
          )
          if count != 1:
              raise RuntimeError('Home canvas color block not found')

          extent_start = text.index('double _homeHeaderExtent(')
          extent_end = text.index('class _HomePinnedHeaderDelegate', extent_start)
          extent = text[extent_start:extent_end]
          if extent.count('ButlerlySpacing.small * 2') != 2:
              raise RuntimeError('Unexpected Home header extent structure')
          extent = extent.replace('ButlerlySpacing.small * 2', 'ButlerlySpacing.small')
          text = text[:extent_start] + extent + text[extent_end:]

          delegate_start = text.index('class _HomePinnedHeaderDelegate')
          delegate_end = text.index('class _HomeHeader', delegate_start)
          delegate = text[delegate_start:delegate_end]
          delegate, count = re.subn(
              r"padding: const EdgeInsets\.symmetric\(\s*"
              r"horizontal: ButlerlySize\.phoneGutter,\s*"
              r"vertical: ButlerlySpacing\.small,\s*\)",
              "padding: const EdgeInsets.fromLTRB(\n"
              "          ButlerlySize.phoneGutter,\n"
              "          ButlerlySpacing.small,\n"
              "          ButlerlySize.phoneGutter,\n"
              "          0,\n"
              "        )",
              delegate,
              count=1,
          )
          if count != 1:
              raise RuntimeError('Home header padding block not found')
          text = text[:delegate_start] + delegate + text[delegate_end:]
          home.write_text(text)

          tokens = Path('apps/butlerly/lib/design_system/tokens/butlerly_tokens.dart')
          text = tokens.read_text()
          if 'static const navigationBarHeight = 78.0;' not in text:
              raise RuntimeError('navigationBarHeight token not found')
          if 'static const primaryNavigationAddIconSize = 52.0;' not in text:
              raise RuntimeError('primaryNavigationAddIconSize token not found')
          text = text.replace(
              'static const navigationBarHeight = 78.0;',
              'static const navigationBarHeight = 64.0;',
              1,
          )
          text = text.replace(
              'static const primaryNavigationAddIconSize = 52.0;',
              'static const primaryNavigationAddIconSize = 44.0;',
              1,
          )
          anchor = '  static const primaryNavigationAddGlyphSize = 28.0;'
          if anchor not in text:
              raise RuntimeError('primary navigation glyph token not found')
          text = text.replace(
              anchor,
              anchor + "\n"
              '  static const primaryNavigationArchRise = 12.0;\n'
              '  static const primaryNavigationArchWidth = 76.0;\n'
              '  static const primaryNavigationArchHeight = 32.0;',
              1,
          )
          tokens.write_text(text)

          identity = Path('apps/butlerly/test/features/home/home_header_device_identity_test.dart')
          text = identity.read_text()
          equality = '      expect(canvas.color, contentSurface.color);'
          if equality not in text:
              raise RuntimeError('phone canvas equality assertion not found')
          text = text.replace(
              equality,
              '      expect(canvas.color, isNot(contentSurface.color));',
              1,
          )
          stale_start = text.index(
              "\n  testWidgets(\n"
              "    'Home keeps pull-to-refresh available across the scroll surface',"
          )
          stale_end = text.index('\n}\n\nFuture<void> _pumpOnIos', stale_start)
          text = text[:stale_start] + text[stale_end:]
          first_canvas = '      final canvas = tester.widget<ColoredBox>(\n'
          if first_canvas not in text:
              raise RuntimeError('Home canvas test insertion point not found')
          text = text.replace(
              first_canvas,
              """      final headerRect = tester.getRect(
                find.byKey(const ValueKey('home-header-surface')),
              );
              final headerContentRect = tester.getRect(
                find.byKey(const ValueKey('home-header-content')),
              );
              expect(
                headerRect.bottom - headerContentRect.bottom,
                lessThanOrEqualTo(2),
              );

              final canvas = tester.widget<ColoredBox>(
          """,
              1,
          )
          identity.write_text(text)

          responsive = Path('apps/butlerly/test/app/responsive_shell_test.dart')
          text = responsive.read_text()
          equality = '      expect(canvas.color, contentSurface.color);'
          if equality not in text:
              raise RuntimeError('responsive phone canvas equality assertion not found')
          text = text.replace(
              equality,
              '      expect(canvas.color, isNot(contentSurface.color));',
              1,
          )
          portrait_marker = "'iPhone portrait keeps iPhone bottom navigation and normal page gutters'"
          portrait_start = text.index(portrait_marker)
          next_test = text.index("\n  _testWidgetsOnIos(", portrait_start)
          portrait = text[portrait_start:next_test]
          close = "\n    },\n  );"
          if close not in portrait:
              raise RuntimeError('phone navigation test close not found')
          assertion = """
              expect(
                tester
                    .getSize(find.byKey(const ValueKey('primary-navigation-content')))
                    .height,
                ButlerlySize.navigationBarHeight,
              );
              expect(
                find.byKey(const ValueKey('primary-navigation-add-arch')),
                findsOneWidget,
              );"""
          portrait = portrait.replace(close, assertion + close, 1)
          text = text[:portrait_start] + portrait + text[next_test:]
          responsive.write_text(text)
          PY

          cat > apps/butlerly/lib/app/shell/shared/primary_bottom_navigation.dart <<'DART'
          import 'package:butlerly/design_system/theme/butlerly_semantic_colors.dart';
          import 'package:butlerly/design_system/tokens/butlerly_tokens.dart';
          import 'package:butlerly/design_system/tokens/butlerly_typography.dart';
          import 'package:butlerly/l10n/app_localizations.dart';
          import 'package:flutter/material.dart';

          double phoneNavigationHeightForLabels({
            required TextScaler textScaler,
            required double itemWidth,
            required Iterable<String> standardLabels,
            required String addLabel,
            required TextStyle labelStyle,
            required TextDirection textDirection,
          }) {
            final availableWidth = itemWidth > 0 ? itemWidth : double.minPositive;

            double labelHeight(String label) {
              final painter = TextPainter(
                text: TextSpan(text: label, style: labelStyle),
                textScaler: textScaler,
                textDirection: textDirection,
                textAlign: TextAlign.center,
              )..layout(maxWidth: availableWidth);
              return painter.height;
            }

            var requiredHeight =
                ButlerlySize.primaryNavigationAddIconSize +
                ButlerlySpacing.micro +
                labelHeight(addLabel);

            for (final label in standardLabels) {
              final destinationHeight =
                  ButlerlySize.standardIcon +
                  ButlerlySize.navigationLabelGap +
                  labelHeight(label);
              if (destinationHeight > requiredHeight) {
                requiredHeight = destinationHeight;
              }
            }

            return requiredHeight < ButlerlySize.navigationBarHeight
                ? ButlerlySize.navigationBarHeight
                : requiredHeight;
          }

          class PrimaryBottomNavigation extends StatelessWidget {
            const PrimaryBottomNavigation({
              required this.navigationKey,
              required this.destinations,
              required this.visualBranchIndexes,
              required this.currentIndex,
              required this.onSelected,
              super.key,
            });

            final Key navigationKey;
            final Map<int, NavigationDestination> destinations;
            final List<int> visualBranchIndexes;
            final int currentIndex;
            final ValueChanged<int> onSelected;

            Widget _destination(
              BuildContext context,
              NavigationDestination destination,
              int branchIndex,
            ) {
              final selected = currentIndex == branchIndex;
              final add = branchIndex == 1;
              final labelStyle = ButlerlyTypography.navigationLabel(
                Theme.of(context).textTheme.labelSmall!,
                color: selected
                    ? context.colors.interactive
                    : context.colors.secondaryText,
                selected: selected,
              );
              final baseIcon = selected
                  ? (destination.selectedIcon ?? destination.icon)
                  : destination.icon;
              final icon = add
                  ? Container(
                      width: ButlerlySize.primaryNavigationAddIconSize,
                      height: ButlerlySize.primaryNavigationAddIconSize,
                      decoration: BoxDecoration(
                        shape: BoxShape.circle,
                        color: selected
                            ? context.colors.brandStrong
                            : context.colors.selection,
                        border: Border.all(
                          width: ButlerlySize.dividerWidth,
                          color: context.colors.interactive.withValues(
                            alpha: ButlerlyOpacity.primaryNavigationBorder,
                          ),
                        ),
                      ),
                      child: IconTheme(
                        data: IconThemeData(
                          size: ButlerlySize.primaryNavigationAddGlyphSize,
                          color: selected
                              ? Theme.of(context).colorScheme.onPrimary
                              : context.colors.interactive,
                        ),
                        child: baseIcon,
                      ),
                    )
                  : IconTheme(
                      data: IconThemeData(
                        size: ButlerlySize.standardIcon,
                        color: selected
                            ? context.colors.interactive
                            : context.colors.secondaryText,
                      ),
                      child: baseIcon,
                    );
              return Semantics(
                button: true,
                selected: selected,
                label: add
                    ? context.l10n.text('addTransactionAction')
                    : destination.label,
                excludeSemantics: true,
                child: InkWell(
                  onTap: () => onSelected(branchIndex),
                  child: SizedBox(
                    height: double.infinity,
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        icon,
                        SizedBox(
                          height: add
                              ? ButlerlySpacing.micro
                              : ButlerlySize.navigationLabelGap,
                        ),
                        Text(
                          destination.label,
                          textAlign: TextAlign.center,
                          softWrap: true,
                          style: labelStyle,
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }

            double _navigationHeight(BuildContext context, double availableWidth) {
              final labelStyle = ButlerlyTypography.navigationLabel(
                Theme.of(context).textTheme.labelSmall!,
                color: context.colors.secondaryText,
                selected: true,
              );
              return phoneNavigationHeightForLabels(
                textScaler: MediaQuery.textScalerOf(context),
                itemWidth: availableWidth / visualBranchIndexes.length,
                standardLabels: [
                  for (final branchIndex in visualBranchIndexes)
                    if (branchIndex != 1) destinations[branchIndex]!.label,
                ],
                addLabel: destinations[1]!.label,
                labelStyle: labelStyle,
                textDirection: Directionality.of(context),
              );
            }

            @override
            Widget build(BuildContext context) {
              final navigationColor =
                  Theme.of(context).navigationBarTheme.backgroundColor ??
                  context.colors.background;
              final divider = BorderSide(
                width: ButlerlySize.dividerWidth,
                color: context.colors.cardDivider,
              );
              final bottomInset = MediaQuery.paddingOf(context).bottom;

              return Material(
                key: navigationKey,
                color: Colors.transparent,
                child: LayoutBuilder(
                  builder: (context, constraints) {
                    final navigationHeight = _navigationHeight(
                      context,
                      constraints.maxWidth,
                    );
                    return SizedBox(
                      height: navigationHeight + bottomInset,
                      child: Stack(
                        children: [
                          Positioned(
                            left: 0,
                            right: 0,
                            top: ButlerlySize.primaryNavigationArchRise,
                            bottom: 0,
                            child: DecoratedBox(
                              decoration: BoxDecoration(
                                color: navigationColor,
                                border: Border(top: divider),
                              ),
                            ),
                          ),
                          if (visualBranchIndexes.contains(1))
                            Align(
                              alignment: Alignment.topCenter,
                              child: Container(
                                key: const ValueKey(
                                  'primary-navigation-add-arch',
                                ),
                                width: ButlerlySize.primaryNavigationArchWidth,
                                height: ButlerlySize.primaryNavigationArchHeight,
                                decoration: BoxDecoration(
                                  color: navigationColor,
                                  borderRadius: const BorderRadius.vertical(
                                    top: Radius.circular(
                                      ButlerlySize.primaryNavigationArchWidth / 2,
                                    ),
                                  ),
                                ),
                              ),
                            ),
                          Positioned(
                            left: 0,
                            right: 0,
                            top: 0,
                            height: navigationHeight,
                            child: SizedBox(
                              key: const ValueKey('primary-navigation-content'),
                              height: navigationHeight,
                              child: Row(
                                children: [
                                  for (final branchIndex in visualBranchIndexes)
                                    Expanded(
                                      child: _destination(
                                        context,
                                        destinations[branchIndex]!,
                                        branchIndex,
                                      ),
                                    ),
                                ],
                              ),
                            ),
                          ),
                        ],
                      ),
                    );
                  },
                ),
              );
            }
          }
          DART

          dart format \
            apps/butlerly/lib/features/foundation/presentation/home_page.dart \
            apps/butlerly/lib/app/shell/shared/primary_bottom_navigation.dart \
            apps/butlerly/lib/design_system/tokens/butlerly_tokens.dart \
            apps/butlerly/test/features/home/home_header_device_identity_test.dart \
            apps/butlerly/test/app/responsive_shell_test.dart

          git rm .github/workflows/apply-pr197-ui-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/butlerly/lib/features/foundation/presentation/home_page.dart \
                  apps/butlerly/lib/app/shell/shared/primary_bottom_navigation.dart \
                  apps/butlerly/lib/design_system/tokens/butlerly_tokens.dart \
                  apps/butlerly/test/features/home/home_header_device_identity_test.dart \
                  apps/butlerly/test/app/responsive_shell_test.dart
          git commit -m "Refine Home surfaces and bottom navigation"
          git push origin HEAD:fix/ios-home-pull-to-refresh
