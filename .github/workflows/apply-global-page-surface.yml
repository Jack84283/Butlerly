name: Apply global page surface rule

on:
  push:
    branches:
      - fix/home-refresh-layout

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-refresh-layout
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - name: Apply shared page-surface rule
        run: |
          python3 -c "import base64; exec(base64.b64decode(''))"
          dart format apps/butlerly/lib/design_system/components/butlerly_components.dart apps/butlerly/lib/design_system/components/butlerly_responsive_body.dart apps/butlerly/lib/features/foundation/presentation/home_page.dart apps/butlerly/test/design_system/page_surface_test.dart
      - run: ./tool/validate.sh flutter_application
      - name: Commit validated shared page-surface rule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/butlerly/lib/design_system/components/butlerly_components.dart apps/butlerly/lib/design_system/components/butlerly_responsive_body.dart apps/butlerly/lib/features/foundation/presentation/home_page.dart apps/butlerly/test/design_system/page_surface_test.dart
          git rm .github/workflows/apply-global-page-surface.yml
          git commit -m "Apply outside-content surface rule across pages"
          git push origin HEAD:fix/home-refresh-layout
