name: Format PR209 P1 Fixes

on:
  push:
    branches:
      - codex/compact-section-header-distinct-donut-colors

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/compact-section-header-distinct-donut-colors
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - name: Format P1 fix files
        run: |
          cd apps/butlerly
          dart format \
            lib/design_system/components/butlerly_components.dart \
            lib/design_system/tokens/butlerly_tokens.dart \
            test/design_system/butlerly_visualization_primitives_test.dart
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/butlerly/lib/design_system/components/butlerly_components.dart apps/butlerly/lib/design_system/tokens/butlerly_tokens.dart apps/butlerly/test/design_system/butlerly_visualization_primitives_test.dart
          git commit -m "Format PR209 P1 fixes"
          git push origin HEAD:codex/compact-section-header-distinct-donut-colors
