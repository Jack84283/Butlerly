name: Temporary Review formatting
on:
  push:
    branches: [codex/transaction-inner-card-shared]
    paths: [.github/workflows/temporary-review-format.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/transaction-inner-card-shared
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
      - run: cd apps/butlerly && flutter pub get
      - run: cd apps/butlerly && dart format lib/features/foundation/presentation/review_page.dart
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add apps/butlerly/lib/features/foundation/presentation/review_page.dart
            git commit -m 'Format Review duplicate action alignment'
            git push origin HEAD:codex/transaction-inner-card-shared
          fi
