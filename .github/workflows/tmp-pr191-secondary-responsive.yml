name: Temporary PR191 secondary responsive patch

on:
  push:
    branches:
      - codex/linkedin-responsive-content

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/linkedin-responsive-content
          fetch-depth: 0
      - name: Apply deterministic responsive patch
        run: python3 .github/scripts/fix_pr191_secondary_responsive.py
      - name: Commit source changes and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-pr191-secondary-responsive.yml
          git rm .github/scripts/fix_pr191_secondary_responsive.py
          git add apps/butlerly/lib/features/foundation/presentation/contextual_pages.dart
          git add apps/butlerly/lib/features/foundation/presentation/privacy_data_page.dart
          git add apps/butlerly/test/app/responsive_shell_test.dart
          git diff --cached --check
          git commit -m "Fix remaining secondary responsive routes"
          git push origin HEAD:codex/linkedin-responsive-content
