name: Delegate approved issue to Codex

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Approved implementation issue number
        required: true
        type: number

permissions:
  contents: read
  issues: write

jobs:
  delegate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'codex-ready' &&
       github.event.issue.user.login == 'Jack84283')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve issue number
        id: issue
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "number=$INPUT_ISSUE" >> "$GITHUB_OUTPUT"
          else
            echo "number=$EVENT_ISSUE" >> "$GITHUB_OUTPUT"
          fi

      - name: Request Codex implementation
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number('${{ steps.issue.outputs.number }}');
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            if (issue.user.login !== 'Jack84283') {
              core.setFailed('Only implementation issues opened by Jack84283 may be delegated.');
              return;
            }
            const labels = issue.labels.map((label) =>
              typeof label === 'string' ? label : label.name
            );
            if (!labels.includes('codex-ready')) {
              core.setFailed('The issue must have the codex-ready label.');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                '@codex Implement this approved issue completely.',
                '',
                'Follow AGENTS.md, .github/codex/prompts/implement.md, and every approved repository document linked by this issue.',
                'Continue through validation and create or update the pull request.',
                'Stop only for a material decision under the clarification protocol.',
              ].join('\n'),
            });
