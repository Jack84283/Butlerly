name: Step 2 Autoformat

on:
  push:
    branches: [feature/step2-receipt-ocr]

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Apply Dart formatter for Step 2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/step2-receipt-ocr
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/butlerly
      - name: Format Step 2 Dart files
        run: |
          dart format apps/butlerly/lib/core/evidence/local_evidence_store.dart \
            apps/butlerly/lib/core/evidence/local_ocr_service.dart \
            apps/butlerly/lib/features/foundation/presentation/receipt_capture_page.dart \
            apps/butlerly/test/core/evidence/local_ocr_service_test.dart \
            packages/butlerly_finance_application/lib/src/use_cases/receipt_transaction_use_case.dart \
            packages/butlerly_finance_application/lib/src/use_cases/reference_data_use_cases.dart \
            apps/butlerly/lib/core/di/finance_services.dart \
            apps/butlerly/lib/app/router/app_router.dart
      - name: Commit formatter output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            apps/butlerly/lib/core/evidence/local_evidence_store.dart \
            apps/butlerly/lib/core/evidence/local_ocr_service.dart \
            apps/butlerly/lib/features/foundation/presentation/receipt_capture_page.dart \
            apps/butlerly/test/core/evidence/local_ocr_service_test.dart \
            packages/butlerly_finance_application/lib/src/use_cases/receipt_transaction_use_case.dart \
            packages/butlerly_finance_application/lib/src/use_cases/reference_data_use_cases.dart \
            apps/butlerly/lib/core/di/finance_services.dart \
            apps/butlerly/lib/app/router/app_router.dart
          git commit -m 'Apply Dart formatter for Step 2'
          git push origin HEAD:feature/step2-receipt-ocr
