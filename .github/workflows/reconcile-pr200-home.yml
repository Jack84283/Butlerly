name: Reconcile PR 200 with main Home behavior

on:
  push:
    branches:
      - fix/home-refresh-layout

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-refresh-layout
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - name: Preserve Home behavior already landed on main
        run: |
          git checkout origin/main -- \
            apps/butlerly/lib/features/foundation/presentation/home_page.dart \
            apps/butlerly/test/features/home/home_pull_to_refresh_test.dart
          python3 .github/scripts/reconcile_home_after_main.py
          dart format \
            apps/butlerly/lib/features/foundation/presentation/home_page.dart \
            apps/butlerly/test/features/home/home_pull_to_refresh_test.dart
      - run: ./tool/validate.sh flutter_application
      - name: Commit reconciled Home implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/butlerly/lib/features/foundation/presentation/home_page.dart \
            apps/butlerly/test/features/home/home_pull_to_refresh_test.dart
          git rm .github/workflows/reconcile-pr200-home.yml
          git rm .github/scripts/reconcile_home_after_main.py
          git commit -m "Reconcile Home refresh behavior with main"
          git push origin HEAD:fix/home-refresh-layout
