name: Temporary Dropdown Test Format Inspection
on:
  push:
    branches:
      - codex/oct10-ui-consistency
    paths:
      - .github/workflows/oct10-dropdown-format-inspect.yml
permissions:
  contents: read
jobs:
  inspect-dropdown-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - name: Inspect pinned Dart formatting
        run: |
          dart format apps/butlerly/test/design_system/butlerly_components_test.dart
          git diff -- apps/butlerly/test/design_system/butlerly_components_test.dart
