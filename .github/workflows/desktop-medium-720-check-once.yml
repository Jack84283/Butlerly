name: Desktop Medium 720 Check Once
on:
  push:
    paths:
      - '.github/workflows/desktop-medium-720-check-once.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/desktop-home-isolated
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
      - name: Format and validate responsive breakpoint tests
        run: |
          cd apps/butlerly
          flutter pub get
          dart format test/app/responsive_shell_test.dart
          flutter analyze --no-pub lib/design_system/tokens/butlerly_tokens.dart test/app/responsive_shell_test.dart
          flutter test --no-pub test/app/responsive_shell_test.dart
      - name: Commit formatting and remove temporary workflow
        if: always()
        run: |
          rm .github/workflows/desktop-medium-720-check-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/butlerly/test/app/responsive_shell_test.dart .github/workflows/desktop-medium-720-check-once.yml
          git commit -m "style(layout): format medium 720px responsive tests" || exit 0
          git push origin HEAD:codex/desktop-home-isolated
