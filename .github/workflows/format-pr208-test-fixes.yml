name: Format PR208 Test Fixes

on:
  push:
    branches:
      - codex/home-trend-baseline-menu-spacing

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/home-trend-baseline-menu-spacing
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - name: Format touched tests
        run: |
          cd apps/butlerly
          dart format \
            test/features/transactions/transaction_lifecycle_test.dart \
            test/features/home/home_page_ui_update_test.dart
      - name: Commit formatter output
        run: |
          if git diff --quiet -- apps/butlerly/test; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/butlerly/test
          git commit -m "Format PR208 test fixes"
          git push origin HEAD:codex/home-trend-baseline-menu-spacing
