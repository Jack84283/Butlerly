name: Validate Home refresh and layout fixes

on:
  push:
    branches:
      - fix/home-refresh-layout

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-refresh-layout
      - uses: ./.github/actions/setup-toolchain
      - run: dart format apps/butlerly/lib/features/foundation/presentation/home_page.dart
      - run: ./tool/setup.sh
      - run: ./tool/validate.sh flutter_application
      - name: Commit formatted validated Home fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/butlerly/lib/features/foundation/presentation/home_page.dart
          git rm .github/workflows/validate-home-refresh-layout.yml
          git commit -m "Validate Home refresh and layout fixes"
          git push origin HEAD:fix/home-refresh-layout
