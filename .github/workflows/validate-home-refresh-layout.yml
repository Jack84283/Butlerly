name: Validate Home refresh and layout fixes

on:
  push:
    branches:
      - fix/home-refresh-layout

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-refresh-layout
      - uses: ./.github/actions/setup-toolchain
      - name: Refine Home refresh layout and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          replacement = base64.b64decode('').decode()
          oldresp = base64.b64decode('ICAgICAgZXhwZWN0KAogICAgICAgIHRlc3RlcgogICAgICAgICAgICAuZ2V0U2l6ZShmaW5kLmJ5S2V5KGNvbnN0IFZhbHVlS2V5KCdob21lLXBhZ2UtY29udGVudC1zdXJmYWNlJykpKQogICAgICAgICAgICAud2lkdGgsCiAgICAgICAgQnV0bGVybHlTaXplLnBhZ2VDb250ZW50TWF4V2lkdGgsCiAgICAgICk7').decode()
          newresp = base64.b64decode('ICAgICAgZXhwZWN0KAogICAgICAgIHRlc3RlcgogICAgICAgICAgICAuZ2V0U2l6ZShmaW5kLmJ5S2V5KGNvbnN0IFZhbHVlS2V5KCdob21lLXBhZ2UtY29udGVudC1zdXJmYWNlJykpKQogICAgICAgICAgICAud2lkdGgsCiAgICAgICAgQnV0bGVybHlTaXplLnBhZ2VDb250ZW50TWF4V2lkdGggKyBCdXRsZXJseVNpemUucGhvbmVHdXR0ZXIgKiAyLAogICAgICApOw==').decode()
          needle = base64.b64decode('ICAgICAgZXhwZWN0KHJlZnJlc2hDb250cm9sLm9uUmVmcmVzaCwgaXNOb3ROdWxsKTsKICAgICAgZXhwZWN0KGZpbmQuYnlLZXkoY29uc3QgVmFsdWVLZXkoJ2hvbWUtcmVmcmVzaC1pbmRpY2F0b3InKSksIGZpbmRzTm90aGluZyk7CgogICAgICBleHBlY3Qoc2Nyb2xsVmlldy5waHlzaWNzLCBpc0E8Qm91bmNpbmdTY3JvbGxQaHlzaWNzPigpKTs=').decode()
          insert = base64.b64decode('').decode()
          home = Path('apps/butlerly/lib/features/foundation/presentation/home_page.dart')
          text = home.read_text()
          start = text.index('    return ColoredBox(', text.index('  Widget build(BuildContext context) {'))
          marker = '\n  }\n}\n\nString homeGreetingKey'
          end = text.index(marker, start)
          home.write_text(text[:start] + replacement + text[end:])
          responsive = Path('apps/butlerly/test/app/responsive_shell_test.dart')
          rtext = responsive.read_text()
          if oldresp not in rtext: raise SystemExit('responsive expectation missing')
          responsive.write_text(rtext.replace(oldresp, newresp, 1))
          refresh = Path('apps/butlerly/test/features/home/home_pull_to_refresh_test.dart')
          ttext = refresh.read_text()
          if needle not in ttext: raise SystemExit('refresh insertion missing')
          refresh.write_text(ttext.replace(needle, insert, 1))
          PY
          dart format apps/butlerly/lib/features/foundation/presentation/home_page.dart apps/butlerly/test/app/responsive_shell_test.dart apps/butlerly/test/features/home/home_pull_to_refresh_test.dart
      - run: ./tool/setup.sh
      - run: ./tool/validate.sh flutter_application
      - name: Commit validated Home fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/butlerly/lib/features/foundation/presentation/home_page.dart apps/butlerly/test/app/responsive_shell_test.dart apps/butlerly/test/features/home/home_pull_to_refresh_test.dart
          git rm .github/workflows/validate-home-refresh-layout.yml
          git commit -m "Fix Home refresh behavior and body layout"
          git push origin HEAD:fix/home-refresh-layout
