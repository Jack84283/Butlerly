name: Validate Home refresh and layout fixes

on:
  push:
    branches:
      - fix/home-refresh-layout

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-refresh-layout
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - name: Apply minimal Home refresh changes
        run: |
          git checkout origin/main -- apps/butlerly/lib/features/foundation/presentation/home_page.dart apps/butlerly/test/app/responsive_shell_test.dart apps/butlerly/test/features/home/home_pull_to_refresh_test.dart
          python3 - <<'PY'
          from pathlib import Path
          import base64
          pairs = {
              'refresh_old': 'ICBGdXR1cmU8dm9pZD4gX3JlZnJlc2goKSBhc3luYyB7CiAgICBmaW5hbCByZWZyZXNoZWQgPSBfbG9hZChmb3JjZUFuYWx5c2lzUmVmcmVzaDogdHJ1ZSk7CiAgICBzZXRTdGF0ZSgoKSB7CiAgICAgIF9kYXRhID0gcmVmcmVzaGVkOwogICAgfSk7CiAgICBhd2FpdCByZWZyZXNoZWQ7CiAgfQ==',
              'refresh_new': 'ICBGdXR1cmU8dm9pZD4gX3JlZnJlc2goKSBhc3luYyB7CiAgICBmaW5hbCByZWZyZXNoZWQgPSBhd2FpdCBfbG9hZChmb3JjZUFuYWx5c2lzUmVmcmVzaDogdHJ1ZSk7CiAgICBpZiAoIW1vdW50ZWQpIHJldHVybjsKICAgIHNldFN0YXRlKCgpIHsKICAgICAgX2RhdGEgPSBGdXR1cmUudmFsdWUocmVmcmVzaGVkKTsKICAgIH0pOwogIH0=',
              'order_old': '',
              'order_new': '',
              'body_old': '',
              'body_new': '',
          }
          decoded = {k: base64.b64decode(v).decode() for k, v in pairs.items()}
          home = Path('apps/butlerly/lib/features/foundation/presentation/home_page.dart')
          text = home.read_text()
          for key in ('refresh', 'order', 'body'):
              old = decoded[key + '_old']
              new = decoded[key + '_new']
              if old not in text: raise SystemExit(key + ' source block missing')
              text = text.replace(old, new, 1)
          home.write_text(text)
          responsive = Path('apps/butlerly/test/app/responsive_shell_test.dart')
          rtext = responsive.read_text()
          rtext = rtext.replace('ButlerlySize.pageContentMaxWidth,\n      );\n      final canvas', 'ButlerlySize.pageContentMaxWidth + ButlerlySize.phoneGutter * 2,\n      );\n      final canvas', 1)
          responsive.write_text(rtext)
          refresh = Path('apps/butlerly/test/features/home/home_pull_to_refresh_test.dart')
          ttext = refresh.read_text()
          anchor = '      expect(refreshControl.onRefresh, isNotNull);\n      expect(find.byKey(const ValueKey(\'home-refresh-indicator\')), findsNothing);\n\n'
          addition = '      final headerIndex = scrollView.slivers.indexWhere(\n        (sliver) => sliver is SliverPersistentHeader,\n      );\n      final refreshIndex = scrollView.slivers.indexWhere(\n        (sliver) => sliver is CupertinoSliverRefreshControl,\n      );\n      expect(refreshIndex, greaterThan(headerIndex));\n\n'
          if anchor not in ttext: raise SystemExit('refresh test anchor missing')
          refresh.write_text(ttext.replace(anchor, anchor + addition, 1))
          PY
          dart format apps/butlerly/lib/features/foundation/presentation/home_page.dart apps/butlerly/test/app/responsive_shell_test.dart apps/butlerly/test/features/home/home_pull_to_refresh_test.dart
      - run: ./tool/validate.sh flutter_application
      - name: Commit validated Home fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/butlerly/lib/features/foundation/presentation/home_page.dart apps/butlerly/test/app/responsive_shell_test.dart apps/butlerly/test/features/home/home_pull_to_refresh_test.dart
          git rm .github/workflows/validate-home-refresh-layout.yml
          git commit -m "Fix Home refresh behavior and body layout"
          git push origin HEAD:fix/home-refresh-layout
