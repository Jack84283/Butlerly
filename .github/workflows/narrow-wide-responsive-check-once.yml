name: Narrow Wide Responsive Check Once
on:
  push:
    paths:
      - '.github/workflows/narrow-wide-responsive-check-once.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/desktop-home-isolated
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
      - name: Format, analyze, and test responsive layouts
        run: |
          cd apps/butlerly
          flutter pub get
          dart format lib/app/shell/wide/wide_primary_shell.dart test/app/responsive_shell_test.dart test/app/butlerly_app_test.dart
          flutter analyze --no-pub lib/app/shell/wide/wide_primary_shell.dart test/app/responsive_shell_test.dart test/app/butlerly_app_test.dart
          flutter test --no-pub test/app/responsive_shell_test.dart test/app/butlerly_app_test.dart test/features/foundation/search_locked_drilldown_test.dart
      - name: Commit formatting and remove temporary workflow
        if: always()
        run: |
          rm .github/workflows/narrow-wide-responsive-check-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/butlerly/lib/app/shell/wide/wide_primary_shell.dart apps/butlerly/test/app/responsive_shell_test.dart apps/butlerly/test/app/butlerly_app_test.dart .github/workflows/narrow-wide-responsive-check-once.yml
          git commit -m "style(responsive): format and validate narrow Wide layout" || exit 0
          git push origin HEAD:codex/desktop-home-isolated
