name: Format PR208 Home Trend Fix

on:
  push:
    branches:
      - codex/home-trend-baseline-menu-spacing

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/home-trend-baseline-menu-spacing
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - name: Format Home trend files
        run: |
          cd apps/butlerly
          dart format \
            lib/features/foundation/presentation/home_page.dart \
            test/features/home/home_page_ui_update_test.dart
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/butlerly/lib/features/foundation/presentation/home_page.dart apps/butlerly/test/features/home/home_page_ui_update_test.dart
          git commit -m "Format PR208 Home trend fix"
          git push origin HEAD:codex/home-trend-baseline-menu-spacing
