name: CI Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  finance_domain:
    name: Finance Domain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - run: ./tool/validate.sh finance_domain

  database:
    name: Database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - run: ./tool/validate.sh database

  finance_application:
    name: Finance Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - run: ./tool/validate.sh finance_application

  flutter_application:
    name: Flutter Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - run: ./tool/validate.sh flutter_application

  # Keep macOS runner usage low for ordinary PRs. Backup/Restore PR #396
  # and desktop/audio PR #399 need native Apple checks before merge because
  # they modify native integrations and platform plugin registration.
  # Alpha restore gate PR #405 additionally needs native iOS production journeys.
  ios_simulator:
    name: iOS Simulator
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && (github.event.pull_request.number == 396 || github.event.pull_request.number == 399 || github.event.pull_request.number == 405))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - run: ./tool/validate.sh ios_simulator

  ios_integration:
    name: iOS Integration Journeys
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && (github.event.pull_request.number == 396 || github.event.pull_request.number == 399 || github.event.pull_request.number == 405))
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - name: Boot iOS simulator
        id: simulator
        run: |
          device_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          test -n "$device_id"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
          echo "device_id=$device_id" >> "$GITHUB_OUTPUT"
      - name: Run targeted iOS production Replace journey
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 405
        timeout-minutes: 12
        env:
          BUTLERLY_IOS_DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          cd apps/butlerly
          flutter test -d "$BUTLERLY_IOS_DEVICE_ID" integration_test/v1_journeys_test.dart --plain-name "production backup restore page completes an encrypted replacement"
      - name: Run iOS integration journeys
        env:
          BUTLERLY_IOS_DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          if ! ./tool/validate.sh integration_test; then
            echo "Initial iOS integration run failed; retrying once for transient Xcode/simulator startup failures."
            ./tool/validate.sh integration_test
          fi

  macos_backup_smoke:
    name: macOS Backup & Restore Smoke Build
    if: github.event_name == 'pull_request' && (github.event.pull_request.number == 396 || github.event.pull_request.number == 399 || github.event.pull_request.number == 405)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - run: ./tool/validate.sh macos_backup
      - name: Run macOS production Replace journey
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 405
        timeout-minutes: 12
        run: |
          cd apps/butlerly
          flutter test -d macos integration_test/v1_journeys_test.dart --plain-name "production backup restore page completes an encrypted replacement"

  android_smoke:
    name: Android Smoke Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - run: ./tool/validate.sh android_smoke
