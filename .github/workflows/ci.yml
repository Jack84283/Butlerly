name: CI Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Only the most recent commit on a PR needs native Alpha verification.
# Cancel superseded PR runs to prevent stale iOS simulator jobs from
# monopolizing the macOS runner queue. Never cancel main-branch push CI.
concurrency:
  group: butlerly-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  finance_domain:
    name: Finance Domain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - run: ./tool/validate.sh finance_domain

  database:
    name: Database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - run: ./tool/validate.sh database

  finance_application:
    name: Finance Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - run: ./tool/validate.sh finance_application

  flutter_application:
    name: Flutter Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - run: ./tool/validate.sh flutter_application

  # Keep macOS runner usage low for ordinary PRs. Backup/Restore PR #396
  # and desktop/audio PR #399 need native Apple checks before merge because
  # they modify native integrations and platform plugin registration.
  # Alpha restore gate PR #405 additionally needs native iOS production journeys.
  ios_simulator:
    name: iOS Simulator
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && (github.event.pull_request.number == 396 || github.event.pull_request.number == 399 || github.event.pull_request.number == 405 || github.event.pull_request.number == 421))
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - run: ./tool/validate.sh ios_simulator

  ios_integration:
    name: iOS Integration Journeys
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && (github.event.pull_request.number == 396 || github.event.pull_request.number == 399 || github.event.pull_request.number == 405 || github.event.pull_request.number == 421))
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      # The pinned Flutter SDK predates the official fix for the iOS simulator
      # VM Service log-stream race. Patch only this disposable CI SDK, not the
      # product toolchain pin or application sources.
      - name: Backport Flutter iOS simulator log-readiness fix
        run: python3 tool/patch_ios_simulator_log_reader.py
      - name: Boot iOS simulator
        timeout-minutes: 6
        id: simulator
        run: |
          device_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          test -n "$device_id"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
          echo "device_id=$device_id" >> "$GITHUB_OUTPUT"
      - name: Run targeted iOS production Replace journeys
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 405
        timeout-minutes: 25
        env:
          BUTLERLY_IOS_DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: ./tool/validate.sh restore_journeys
      # PR #421 tests each native journey independently, with bounded launch
      # time. The second test still runs when the first reports a failure.
      - name: Run encrypted production Replace (iOS)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 421
        timeout-minutes: 12
        env:
          BUTLERLY_IOS_DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: ./tool/validate.sh restore_ui_replace
      - name: Run blocked WAL reader refusal and retry (iOS)
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.number == 421 && steps.simulator.outcome == 'success' }}
        timeout-minutes: 12
        env:
          BUTLERLY_IOS_DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: ./tool/validate.sh restore_busy_reader
      # Keep the full iOS journey suite on main and other eligible PRs.
      # The restore-focused PRs run the two production Replace regressions
      # independently, so one hung journey does not contaminate later tests.
      - name: Run iOS integration journeys
        if: github.event_name == 'push' || (github.event.pull_request.number != 405 && github.event.pull_request.number != 421)
        timeout-minutes: 25
        env:
          BUTLERLY_IOS_DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          if ! ./tool/validate.sh integration_test; then
            echo "Initial iOS integration run failed; retrying once for transient Xcode/simulator startup failures."
            ./tool/validate.sh integration_test
          fi

  macos_backup_smoke:
    name: macOS Backup & Restore Smoke Build
    if: github.event_name == 'pull_request' && (github.event.pull_request.number == 396 || github.event.pull_request.number == 399 || github.event.pull_request.number == 405 || github.event.pull_request.number == 421)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - run: ./tool/validate.sh macos_backup
      - name: Run macOS production Replace journey
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 405
        timeout-minutes: 25
        run: ./tool/validate.sh restore_journeys

  android_smoke:
    name: Android Smoke Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - run: ./tool/validate.sh android_smoke
