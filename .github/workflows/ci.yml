name: CI Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  finance_domain:
    name: Finance Domain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - run: ./tool/validate.sh finance_domain

  database:
    name: Database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - run: ./tool/validate.sh database

  finance_application:
    name: Finance Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - run: ./tool/validate.sh finance_application

  flutter_application:
    name: Flutter Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - run: ./tool/validate.sh flutter_application

  # Native iOS validation needs Xcode and Apple's simulator tooling. Keep these
  # checks on macOS, but run them after changes land on main so PR validation is
  # not held open while waiting for limited GitHub-hosted macOS capacity.
  ios_simulator:
    name: iOS Simulator
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - run: flutter build ios --simulator --no-codesign
        working-directory: apps/butlerly

  ios_integration:
    name: iOS Integration Journeys
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - name: Boot iOS simulator
        id: simulator
        run: |
          device_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          test -n "$device_id"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
          echo "device_id=$device_id" >> "$GITHUB_OUTPUT"
      - run: ./tool/validate.sh integration_test
        env:
          BUTLERLY_IOS_DEVICE_ID: ${{ steps.simulator.outputs.device_id }}

  android_smoke:
    name: Android Smoke Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - run: ./tool/validate.sh android_smoke
