name: CI Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  formatter_diagnostic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/butlerly
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Show canonical formatter diff
        run: |
          dart format lib/core/evidence/local_evidence_store.dart
          git diff -- lib/core/evidence/local_evidence_store.dart
          exit 1
