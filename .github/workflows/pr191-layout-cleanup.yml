name: PR191 Layout Cleanup

on:
  push:
    branches:
      - codex/linkedin-responsive-content
    paths:
      - .github/workflows/pr191-layout-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/linkedin-responsive-content
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
      - name: Apply responsive layout cleanup
        run: python3 .github/scripts/pr191_layout_cleanup.py
      - name: Format touched Dart files
        run: |
          dart format \
            apps/butlerly/lib/app/shell/adaptive_shell.dart \
            apps/butlerly/lib/design_system/components/butlerly_components.dart \
            apps/butlerly/lib/design_system/components/butlerly_responsive_body.dart \
            apps/butlerly/lib/design_system/tokens/butlerly_tokens.dart \
            apps/butlerly/lib/features/foundation/presentation/contextual_pages.dart \
            apps/butlerly/lib/features/foundation/presentation/home_page.dart \
            apps/butlerly/lib/features/foundation/presentation/legal_licenses_page.dart \
            apps/butlerly/test/app/responsive_shell_test.dart
      - name: Remove temporary cleanup files
        run: |
          rm .github/scripts/pr191_layout_cleanup.py
          rm .github/workflows/pr191-layout-cleanup.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Simplify responsive layout policy"
          git push origin HEAD:codex/linkedin-responsive-content
