name: Format Preview

on:
  push:
    branches:
      - codex/payment-source-master-data-ui

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - name: Format changed Dart files and print diff
        run: |
          cd apps/butlerly
          dart format             lib/features/foundation/presentation/master_data_page.dart             lib/features/foundation/presentation/payment_sources_page.dart             lib/features/foundation/presentation/transactions_page.dart             test/design_system/butlerly_compact_section_selector_test.dart             test/features/transactions/transaction_lifecycle_test.dart
          git diff --             lib/features/foundation/presentation/master_data_page.dart             lib/features/foundation/presentation/payment_sources_page.dart             lib/features/foundation/presentation/transactions_page.dart             test/design_system/butlerly_compact_section_selector_test.dart             test/features/transactions/transaction_lifecycle_test.dart
