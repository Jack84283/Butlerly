name: Request Codex CI repair

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request whose failed CI should be repaired
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  request-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR and request repair
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = Number('${{ inputs.pull_request_number }}');
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (!pr.head.ref.startsWith('codex/') &&
                !pr.head.ref.startsWith('automation/')) {
              core.setFailed('Automated repair is limited to codex/* and automation/* branches.');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: [
                '@codex Fix the failing CI checks on this pull request.',
                '',
                'Follow AGENTS.md and .github/codex/prompts/repair-ci.md.',
                'Push corrections to the existing branch and do not create another PR.',
              ].join('\n'),
            });
