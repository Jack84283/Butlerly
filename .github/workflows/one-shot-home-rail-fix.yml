name: One-shot Home rail width fix

on:
  push:
    branches:
      - codex/home-sticky-header-search

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/home-sticky-header-search
          fetch-depth: 0

      - name: Apply targeted Home header width fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/butlerly/lib/features/foundation/presentation/home_page.dart')
          text = path.read_text()

          old = """            SliverPersistentHeader(
              pinned: true,
              delegate: _HomePinnedHeaderDelegate(
                extent: _homeHeaderExtent(context),
                child: FutureBuilder<_HomeData>(
                  future: future,
                  builder: (context, snapshot) {
                    final data =
                        snapshot.data ??
                        _HomeData.empty(_now, selectedMonth: _selectedMonth);
                    final loading =
                        snapshot.connectionState != ConnectionState.done;
                    return _HomeHeader(
                      month: data.displayMonth,
                      greetingKey: homeGreetingKey(_now),
                      onMonthTap: loading ? null : () => _selectMonth(data),
                    );
                  },
                ),
              ),
            ),
"""
          new = """            SliverLayoutBuilder(
              builder: (context, constraints) => SliverPersistentHeader(
                pinned: true,
                delegate: _HomePinnedHeaderDelegate(
                  extent: _homeHeaderExtent(
                    context,
                    crossAxisExtent: constraints.crossAxisExtent,
                  ),
                  child: FutureBuilder<_HomeData>(
                    future: future,
                    builder: (context, snapshot) {
                      final data =
                          snapshot.data ??
                          _HomeData.empty(_now, selectedMonth: _selectedMonth);
                      final loading =
                          snapshot.connectionState != ConnectionState.done;
                      return _HomeHeader(
                        month: data.displayMonth,
                        greetingKey: homeGreetingKey(_now),
                        onMonthTap: loading ? null : () => _selectMonth(data),
                      );
                    },
                  ),
                ),
              ),
            ),
"""
          assert text.count(old) == 1, 'expected exactly one pinned header block'
          text = text.replace(old, new, 1)

          old = 'double _homeHeaderExtent(BuildContext context) {'
          new = """double _homeHeaderExtent(
            BuildContext context, {
            required double crossAxisExtent,
          }) {"""
          assert text.count(old) == 1, 'expected exactly one header extent signature'
          text = text.replace(old, new, 1)

          old = '(MediaQuery.sizeOf(context).width - ButlerlySize.phoneGutter * 2)'
          new = '(crossAxisExtent - ButlerlySize.phoneGutter * 2)'
          assert text.count(old) == 1, 'expected exactly one MediaQuery width measurement'
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          rm .github/workflows/one-shot-home-rail-fix.yml

      - name: Commit targeted fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/butlerly/lib/features/foundation/presentation/home_page.dart .github/workflows/one-shot-home-rail-fix.yml
          git diff --cached --check
          git commit -m "Measure Home header against actual sliver width"
          git push origin HEAD:codex/home-sticky-header-search
