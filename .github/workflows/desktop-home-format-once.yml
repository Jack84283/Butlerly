name: Desktop Home Format Once
on:
  push:
    paths:
      - '.github/workflows/desktop-home-format-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/desktop-home-isolated
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
      - name: Format and remove temporary workflow
        run: |
          dart format apps/butlerly/lib/app/router/app_router.dart apps/butlerly/lib/features/desktop/presentation/desktop_home_page.dart
          rm .github/workflows/desktop-home-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/butlerly/lib/app/router/app_router.dart apps/butlerly/lib/features/desktop/presentation/desktop_home_page.dart .github/workflows/desktop-home-format-once.yml
          git commit -m "style(desktop): apply Dart formatter" || exit 0
          git push origin HEAD:codex/desktop-home-isolated
