name: Format Shared Surface Test Updates

on:
  push:
    branches:
      - codex/shared-outside-content-layout

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/shared-outside-content-layout
      - uses: ./.github/actions/setup-toolchain
      - run: ./tool/setup.sh
      - name: Format updated tests
        run: |
          cd apps/butlerly
          dart format \
            test/features/home/home_header_device_identity_test.dart \
            test/features/home/home_pull_to_refresh_test.dart \
            test/app/responsive_shell_test.dart
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/butlerly/test
          git commit -m "Format shared surface test updates"
          git push origin HEAD:codex/shared-outside-content-layout
