name: Step 2 Analyzer Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feature/step2-receipt-ocr' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/step2-receipt-ocr
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/butlerly
      - name: Apply Flutter deprecation fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/butlerly/lib/features/foundation/presentation/receipt_capture_page.dart')
          text = path.read_text()
          text = text.replace('value: _merchantId,', 'initialValue: _merchantId,')
          text = text.replace('value: _categoryId,', 'initialValue: _categoryId,')
          text = text.replace('value: _paymentSourceId,', 'initialValue: _paymentSourceId,')
          path.write_text(text)
          PY
          dart format apps/butlerly/lib/core/evidence/local_ocr_service.dart \
            apps/butlerly/lib/features/foundation/presentation/receipt_capture_page.dart
      - name: Commit fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            apps/butlerly/lib/core/evidence/local_ocr_service.dart \
            apps/butlerly/lib/features/foundation/presentation/receipt_capture_page.dart
          git commit -m 'Apply Step 2 analyzer fixes'
          git push origin HEAD:feature/step2-receipt-ocr
