name: Temp Format P0 Remediation

on:
  push:
    branches:
      - codex/p0-correctness-architecture-fixes
    paths:
      - packages/butlerly_finance_application/lib/src/use_cases/statement_use_cases.dart
      - packages/butlerly_finance_application/test/statement_batch_import_test.dart
      - apps/butlerly/lib/core/import/local_csv_importer.dart
      - apps/butlerly/lib/features/foundation/presentation/review_page.dart
      - apps/butlerly/lib/features/foundation/presentation/statement_capture_page.dart
      - apps/butlerly/test/core/import/local_csv_importer_test.dart
      - apps/butlerly/test/features/foundation/statement_capture_page_test.dart
      - .github/workflows/temp-format-p0-remediation.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/p0-correctness-architecture-fixes

      - uses: ./.github/actions/setup-toolchain

      - name: Run repository setup
        run: ./tool/setup.sh

      - name: Format finance application changes
        working-directory: packages/butlerly_finance_application
        run: dart format lib/src/use_cases/statement_use_cases.dart test/statement_batch_import_test.dart

      - name: Format Flutter application changes
        working-directory: apps/butlerly
        run: dart format lib/core/import/local_csv_importer.dart lib/features/foundation/presentation/review_page.dart lib/features/foundation/presentation/statement_capture_page.dart test/core/import/local_csv_importer_test.dart test/features/foundation/statement_capture_page_test.dart

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/butlerly_finance_application apps/butlerly
          git commit -m "Format consolidated P0 remediation"
          git push origin HEAD:codex/p0-correctness-architecture-fixes
