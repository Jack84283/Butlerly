name: Temp Format P0 Correctness

on:
  push:
    branches:
      - codex/p0-correctness-architecture-fixes
    paths:
      - apps/butlerly/**
      - packages/butlerly_database/**
      - packages/butlerly_finance_application/**
      - .github/workflows/temp-format-p0-correctness.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/p0-correctness-architecture-fixes

      - uses: ./.github/actions/setup-toolchain

      - name: Run repository setup
        run: ./tool/setup.sh

      - name: Format changed Dart packages in validation context
        run: |
          (cd packages/butlerly_finance_application && dart format .)
          (cd packages/butlerly_database && dart format .)
          (cd apps/butlerly && dart format .)

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/butlerly packages/butlerly_database packages/butlerly_finance_application
          git commit -m "Format P0 correctness changes"
          git push origin HEAD:codex/p0-correctness-architecture-fixes
