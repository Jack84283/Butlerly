name: Temporary UI polish formatting
on:
  push:
    branches:
      - codex/transaction-inner-card-shared
    paths:
      - .github/workflows/temporary-ui-polish-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/transaction-inner-card-shared
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
      - name: Resolve Flutter project
        run: cd apps/butlerly && flutter pub get
      - name: Format changed UI files
        run: |
          cd apps/butlerly
          dart format lib/features/foundation/presentation/transactions_page.dart lib/features/foundation/presentation/review_page.dart lib/features/analysis/presentation/analysis_page.dart lib/features/analysis/presentation/widgets/analysis_activity.dart lib/features/analysis/presentation/widgets/analysis_data_quality.dart lib/features/analysis/presentation/widgets/analysis_spending_breakdown.dart lib/features/analysis/presentation/widgets/analysis_insight_preview.dart lib/features/insights/presentation/insight_grouped_list.dart test/features/transactions/transaction_lifecycle_test.dart
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add apps/butlerly/lib apps/butlerly/test
            git commit -m 'Format UI refinements with project Dart version'
            git push origin HEAD:codex/transaction-inner-card-shared
          fi
