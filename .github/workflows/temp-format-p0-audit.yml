name: Temp Format P0 Audit Fixes

on:
  push:
    branches:
      - codex/p0-audit-correctness-fixes
    paths:
      - .github/workflows/temp-format-p0-audit.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/p0-audit-correctness-fixes

      - uses: ./.github/actions/setup-toolchain

      - name: Run repository setup
        run: ./tool/setup.sh

      - name: Format finance application changes
        working-directory: packages/butlerly_finance_application
        run: |
          dart format             lib/src/use_cases/statement_use_cases.dart             test/statement_batch_import_test.dart

      - name: Format Flutter application changes
        working-directory: apps/butlerly
        run: |
          dart format             lib/core/import/local_csv_importer.dart             lib/features/foundation/presentation/master_data_page.dart             test/core/import/local_csv_importer_test.dart             test/features/foundation/statement_capture_page_test.dart

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             packages/butlerly_finance_application/lib/src/use_cases/statement_use_cases.dart             packages/butlerly_finance_application/test/statement_batch_import_test.dart             apps/butlerly/lib/core/import/local_csv_importer.dart             apps/butlerly/lib/features/foundation/presentation/master_data_page.dart             apps/butlerly/test/core/import/local_csv_importer_test.dart             apps/butlerly/test/features/foundation/statement_capture_page_test.dart
          git commit -m "Format P0 audit correctness fixes"
          git push origin HEAD:codex/p0-audit-correctness-fixes
