name: Desktop Flutter Format Once
on:
  push:
    paths:
      - '.github/workflows/desktop-format-app-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/desktop-home-isolated
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
      - name: Format in Flutter package root
        run: |
          (cd apps/butlerly && dart format lib/app/router/app_router.dart lib/features/desktop/presentation/desktop_home_page.dart)
          rm .github/workflows/desktop-format-app-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/butlerly/lib/app/router/app_router.dart apps/butlerly/lib/features/desktop/presentation/desktop_home_page.dart .github/workflows/desktop-format-app-once.yml
          git commit -m "style(desktop): format using Flutter app settings" || exit 0
          git push origin HEAD:codex/desktop-home-isolated
