name: butlerly_database
description: SQLite infrastructure adapters for Butlerly Version 1.
version: 0.1.0
publish_to: none

flutter:
  assets:
    - database/schema/v1.sql
    - database/seed/catalog.sql

environment:
  sdk: ^3.12.0

dependencies:
  butlerly_finance_domain:
    path: ../butlerly_finance_domain
  sqflite_common: ^2.5.11

dev_dependencies:
  butlerly_finance_application:
    path: ../butlerly_finance_application
  lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2
  test: ^1.26.0
